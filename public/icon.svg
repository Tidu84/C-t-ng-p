<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2c1810"/>
      <stop offset="70%" stop-color="#190e09"/>
      <stop offset="100%" stop-color="#0c0704"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="50%" stop-color="#fda085"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="pieceWood" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fdf3e7"/>
      <stop offset="25%" stop-color="#edd8bd"/>
      <stop offset="65%" stop-color="#c99d66"/>
      <stop offset="92%" stop-color="#8c5828"/>
      <stop offset="100%" stop-color="#542e0d"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#4a2505" flood-opacity="0.6"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background container with rounded corners for squircle / android icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative board grid behind piece -->
  <g opacity="0.25" stroke="#d4af37" stroke-width="2">
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
    <!-- Palace diagonal cross lines -->
    <line x1="128" y1="128" x2="384" y2="384"/>
    <line x1="384" y1="128" x2="128" y2="384"/>
  </g>

  <!-- Outer Golden Ring border -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#goldBorder)" stroke-width="6" opacity="0.8"/>
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="#d4af37" stroke-dasharray="8 6" stroke-width="2" opacity="0.4"/>

  <!-- Chess Piece (Cờ Úp: Mặt quân gỗ tinh xảo với biểu tượng Tướng & Họa tiết nắp úp bí ẩn) -->
  <g filter="url(#dropShadow)" transform="translate(256, 236)">
    <!-- Base 3D piece drop rim -->
    <circle cx="0" cy="14" r="162" fill="#3a1e09" opacity="0.9"/>
    <!-- Main wood body -->
    <circle cx="0" cy="0" r="162" fill="url(#pieceWood)"/>
    <!-- Inner concentric carved rings -->
    <circle cx="0" cy="0" r="148" fill="none" stroke="#7a471c" stroke-width="2.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="138" fill="none" stroke="#d97706" stroke-width="3.5" opacity="0.75"/>
    <circle cx="0" cy="0" r="132" fill="none" stroke="#92400e" stroke-width="1.5" opacity="0.5"/>

    <!-- Carved Inner Circle -->
    <circle cx="0" cy="0" r="115" fill="#fcf8f2" opacity="0.95" filter="url(#innerGlow)"/>
    <circle cx="0" cy="0" r="114" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="12 4" opacity="0.6"/>

    <!-- Traditional Calligraphy: 帥 (Tướng Đỏ / Soái) -->
    <text x="0" y="44" font-family="'Ma Shan Zheng', 'Charm', 'Noto Serif SC', serif" font-size="118" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="1">帥</text>
    <text x="0" y="44" font-family="'Ma Shan Zheng', 'Charm', 'Noto Serif SC', serif" font-size="118" font-weight="900" fill="none" stroke="#7f1d1d" stroke-width="2" text-anchor="middle">帥</text>
    
    <!-- Cờ Úp mystique shadow veil (Bí ẩn lật quân) -->
    <path d="M-80,-100 Q 0,-140 80,-100 Q 140,-40 140,20 Q 80,120 0,140 Q -100,100 -120,20 Z" fill="#d97706" opacity="0.12"/>
  </g>

  <!-- Banner badge below piece: CỜ TƯỚNG ÚP -->
  <g transform="translate(256, 436)">
    <rect x="-140" y="-24" width="280" height="48" rx="24" fill="#b45309" stroke="#fef3c7" stroke-width="3" filter="url(#dropShadow)"/>
    <text x="0" y="8" font-family="'Be Vietnam Pro', 'Inter', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">CỜ TƯỚNG ÚP</text>
  </g>
</svg>
