apply plugin: 'com.android.application'

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('keystore.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}


def premiumProperties = new Properties()
def premiumFile = rootProject.file('premium.properties')
if (premiumFile.exists()) { premiumFile.withInputStream { premiumProperties.load(it) } }
def javaString = { value -> groovy.json.JsonOutput.toJson(value.toString()) }

android {
    namespace = "com.cotuongup.game"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }
    ndkVersion "28.2.13676358"
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }

    signingConfigs {
        release {
            storeFile file(signingProperties.getProperty('storeFile'))
            storePassword signingProperties.getProperty('storePassword')
            keyAlias signingProperties.getProperty('keyAlias')
            keyPassword signingProperties.getProperty('keyPassword')
        }
    }

    defaultConfig {
        applicationId "com.cotuongup.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        ndk { abiFilters "arm64-v8a", "x86_64" }
        externalNativeBuild { cmake { arguments "-DANDROID_STL=c++_shared" } }
        buildConfigField 'String', 'PREMIUM_PRODUCT_ID', javaString(premiumProperties.getProperty('productId', 'ai_premium'))
        buildConfigField 'String', 'PREMIUM_VERIFY_URL', javaString(premiumProperties.getProperty('verifyUrl', ''))
        buildConfigField 'String', 'PREMIUM_PUBLIC_KEY', javaString(premiumProperties.getProperty('publicKey', ''))
        versionCode 213
        versionName "2.1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.enginecheck'
            resValue 'string', 'app_name', 'Cờ Úp · Thử AI'
            resValue 'string', 'title_activity_main', 'Cờ Úp · Thử AI'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "com.android.billingclient:billing:9.1.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    // implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Always prepare fresh web assets, even when building directly from Android Studio.
def prepareReleaseWeb = tasks.register('prepareReleaseWeb', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/android-release.mjs', 'prepare'
}
tasks.matching { it.name == 'preReleaseBuild' || it.name == 'preDebugBuild' }.configureEach {
    dependsOn prepareReleaseWeb
}
